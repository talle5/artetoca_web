<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel="stylesheet" href="../css/membros.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&display=swap" rel="stylesheet">
</head>

<body class="main_layout">
    <div id="nav_bar"></div>
    <main class="main_content">
        <header class="header">
            <h2>Nossos Membros</h2>
            <p class="gray_text_color">Conheça os talentosos artesãos e artistas da nossa associação.</p>
        </header>
        <div class="info_line">
            <div class="info_card info_card_artesoes border_round">
                <div class="icon_bg bg_orange">
                    <img src="../assets/icons/user.png" alt="">
                </div>
                <div class="flex_col aling_start">
                    <p class="font_size_4">45+</p>
                    <p class="font_size_3 gray_text_color">Membros Ativos</p>
                </div>
            </div>
            <div class="info_card info_card_especialidade border_round">
                <div class="icon_bg bg_purple">
                    <img src="../assets/icons/color-palette.png" alt="">
                </div>
                <div class="flex_col aling_start">
                    <p class="font_size_4">12</p>
                    <p class="font_size_3 gray_text_color">Especialidades</p>
                </div>
            </div>
        </div>
        <div id="membros_grid"></div>
        <div id="description_window"></div>
    </main>
    <script src="../js/componentes/navbar.js"></script>
    <script type="module" src="../js/pages/membros.js"></script>
</body>

</html>
