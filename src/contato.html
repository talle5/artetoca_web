<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Contato</title>
    <link rel="stylesheet" href="../css/contato.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&display=swap" rel="stylesheet">
</head>

<body class="main_layout">
    <div id="nav_bar"></div>
    <main class="main_content contato">
        <header class="header">
            <h2>Entre em contato</h2>
            <p class="gray_text_color">
                Estamos aqui para responder suas dúvidas e receber suas sugestões
            </p>
        </header>
        <form class="border_round">
            <h2 class="cell full">Envie uma Mensagem</h2>
            <div class="cell">
                <label>Nome</label>
                <input type="text" id="nome" class="form_input border_round">
            </div>
            <div class="cell">
                <label>Email</label>
                <input type="text" id="email" class="form_input border_round">
            </div>
            <div class="cell full">
                <label>Assunto</label>
                <input type="text" name="" id="assunto" class="form_input border_round">
            </div>
            <div class="cell full">
                <label>Mensagem</label>
                <textarea type="text" id="mensagem" class="form_input border_round"> </textarea>
            </div>
            <button>
                <img src="" alt="">
                <p>Enviar mensagem</p>
            </button>
        </form>
        <div id="email_card" class="info_card border_round">
            <div class="icon_bg">
                <img class="icon" src="../assets/icons/e-mail.png" alt="">
            </div>

            <div>
                <p>Email</p>
                <p class="gray_text_color">aartetoca@gmail.com</p>
            </div>
        </div>
        <div id="whatszap_card" class="info_card border_round">
            <div class="icon_bg">
                <img class="icon" src="../assets/icons/whatsapp.png" alt="">
            </div>
            <div>
                <p>Whatsapp</p>
                <p class="gray_text_color">(85) 992001072</p>
            </div>
        </div>
        <div id="instagram_card" class="info_card border_round">
            <div class="icon_bg">
                <img class="icon" src="../assets/icons/instagram.png" alt="">
            </div>
            <div>
                <p>Instagram</p>
                <p class="gray_text_color">@artetoca_ocara</p>
            </div>
        </div>
        <div id="address_card" class="info_card border_round">
            <div class="icon_bg">
                <img class="icon" src="../assets/icons/mapas.png" alt="">
            </div>
            <div>
                <p>Endereço</p>
                <p class="gray_text_color">Arena Kactus - Ocara / CE</p>
            </div>
        </div>
    </main>
    <script src="../js/componentes/navbar.js"></script>
</body>

</html>
