<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel="stylesheet" href="../css/contato.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&display=swap" rel="stylesheet">
</head>

<body class="main_layout">
    <div id="nav_bar"></div>
    <main class="main_content contato">
        <header class="header">
            <h2>Entre em contato</h2>
            <p class="gray_text_color">
                Estamos aqui para responder suas dúvidas e receber suas sugestões
            </p>
        </header>
        <form class="border_round">
            <h2>Envie uma Mensagem</h2>
            <div class="tab-grid">
                <div class="cell">
                    <label>Nome</label>
                    <input type="text" id="nome" class="form_input">
                </div>
                <div class="cell">
                    <label>Email</label>
                    <input type="text" id="email" class="form_input">
                </div>
                <div class="cell full">
                    <label>Assunto</label>
                    <input type="text" name="" id="assunto" class="form_input">
                </div>
                <div class="cell full">
                    <label>Mensagem</label>
                    <textarea type="text" id="mensagem" class="form_input"> </textarea>
                </div>

                <button>
                    <img src="" alt="">
                    <p>Enviar mensagem</p>
                </button>

            </div>
        </form>
        <div class="info_card">
            <div class="icon_bg">
                <img src="../assets/icons/mapas-e-bandeiras.png" alt="">
            </div>

            <div>
                <p>Endereço</p>
                <p class="gray_text_color">Rua das Artes, 123</p>
            </div>
        </div>
        <div class="info_card">
            <div class="icon_bg">
                <img src="../assets/icons/e-mail.png" alt="">
            </div>
            <div>
                <p>Endereço</p>
                <p class="gray_text_color">Rua das Artes, 123</p>
            </div>
        </div>
    </main>
    <script src="../js/componentes/navbar.js"></script>
</body>

</html>
